[package]
authors = [ "Coffee Bean <beanc904@gmail.com>" ]
name = "akasha"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
aka-logger = { path = "crates/aka-logger", features = ["export"] }
chrono = "0.4.44"
color-eyre = "0.6.3"
crossterm = { version = "0.28.1", features = ["event-stream"] }
dirs = "5.0"
futures = "0.3.31"
ratatui = "0.30.0"
tokio = { version = "1.40.0", features = ["full"] }
toml = "1.1.2"
serde_yaml = "0.9"
unicode-width = "0.2"

thiserror = "2"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio-tungstenite = "0.28"
rand = "0.9"
http = "1.3"
httparse = "1.10"
log = "0.4"
env_logger = "0.11"
urlencoding = "2.1"
ts-rs = "11.0"
pin-project = "1.1"
base64 = "0.22.1"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }

[dev-dependencies]
dotenvy = "=0.15.7"

[lib]
path = "src/lib/mod.rs"
